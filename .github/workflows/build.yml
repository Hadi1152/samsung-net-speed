name: Build Modern NetSpeed APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Modern Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/netspeed
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NetSpeedPro"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2'
              id 'org.jetbrains.kotlin.android' version '1.9.22'
          }

          android {
              namespace 'com.example.netspeed'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.netspeed"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="NetSpeed Pro"
                  android:icon="@drawable/ic_logo"
                  android:roundIcon="@drawable/ic_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SpeedMeterService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#121212"
                android:pathData="M0,0h24v24h-24z"/>
            <path
                android:fillColor="#00E676"
                android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM13,17h-2v-6h2v6zM13,9h-2L11,7h2v2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1E1E2C"/>
              <corners android:radius="16dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_button_start.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#00C853"/>
              <corners android:radius="14dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_button_stop.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FF3D00"/>
              <corners android:radius="14dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center_horizontal"
              android:padding="24dp"
              android:background="#0F0F1A">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:layout_marginTop="20dp"
                  android:layout_marginBottom="30dp">
                  
                  <ImageView
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:src="@drawable/ic_logo"/>

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:layout_marginStart="16dp">
                      
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="NetSpeed Pro"
                          android:textColor="#FFFFFF"
                          android:textSize="20sp"
                          android:textStyle="bold"/>

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="مراقب السرعة واستهلاك البيانات"
                          android:textColor="#8F8FA3"
                          android:textSize="12sp"/>
                  </LinearLayout>
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:padding="24dp"
                  android:background="@drawable/bg_card"
                  android:layout_marginBottom="20dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="السرعة الحالية"
                      android:textColor="#8F8FA3"
                      android:textSize="14sp"
                      android:layout_marginBottom="8dp"/>

                  <TextView
                      android:id="@+id/tvSpeed"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="0.0 KB/s"
                      android:textColor="#00E676"
                      android:textSize="40sp"
                      android:textStyle="bold"/>
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:weightSum="2"
                  android:layout_marginBottom="30dp">

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical"
                      android:padding="16dp"
                      android:background="@drawable/bg_card"
                      android:layout_marginEnd="8dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="استهلاك الواي فاي"
                          android:textColor="#8F8FA3"
                          android:textSize="12sp"/>

                      <TextView
                          android:id="@+id/tvWifi"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="0 MB"
                          android:textColor="#00B0FF"
                          android:textSize="18sp"
                          android:textStyle="bold"
                          android:layout_marginTop="8dp"/>
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical"
                      android:padding="16dp"
                      android:background="@drawable/bg_card"
                      android:layout_marginStart="8dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="استهلاك البيانات"
                          android:textColor="#8F8FA3"
                          android:textSize="12sp"/>

                      <TextView
                          android:id="@+id/tvMobile"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="0 MB"
                          android:textColor="#FFCA28"
                          android:textSize="18sp"
                          android:textStyle="bold"
                          android:layout_marginTop="8dp"/>
                  </LinearLayout>
              </LinearLayout>

              <Button
                  android:id="@+id/btnStart"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:text="تشغيل المؤشر بالاعلى"
                  android:background="@drawable/bg_button_start"
                  android:textColor="#FFFFFF"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="12dp"
                  app:backgroundTint="@null"/>

              <Button
                  android:id="@+id/btnStop"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:text="إيقاف المؤشر"
                  android:background="@drawable/bg_button_stop"
                  android:textColor="#FFFFFF"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="12dp"
                  app:backgroundTint="@null"/>

              <Button
                  android:id="@+id/btnReset"
                  android:layout_width="match_parent"
                  android:layout_height="48dp"
                  android:text="تصفير العدادات"
                  android:backgroundTint="#2A2A3D"
                  android:textColor="#B0B0C3"
                  android:textSize="14sp"/>

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/netspeed/SpeedMeterService.kt
          package com.example.netspeed

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.net.TrafficStats
          import android.os.*
          import androidx.core.app.NotificationCompat

          class SpeedMeterService : Service() {

              private val handler = Handler(Looper.getMainLooper())
              private var lastTotalBytes: Long = 0
              private var lastMobileBytes: Long = 0
              private val CHANNEL_ID = "NetSpeedProChannel"

              private val runnable = object : Runnable {
                  override fun run() {
                      val currentTotal = TrafficStats.getTotalRxBytes() + TrafficStats.getTotalTxBytes()
                      val currentMobile = TrafficStats.getMobileRxBytes() + TrafficStats.getMobileTxBytes()

                      val deltaTotal = (currentTotal - lastTotalBytes).coerceAtLeast(0L)
                      val deltaMobile = (currentMobile - lastMobileBytes).coerceAtLeast(0L)
                      val deltaWifi = (deltaTotal - deltaMobile).coerceAtLeast(0L)

                      lastTotalBytes = currentTotal
                      lastMobileBytes = currentMobile

                      val prefs = getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                      val totalWifi = prefs.getLong("wifi_bytes", 0L) + deltaWifi
                      val totalMobile = prefs.getLong("mobile_bytes", 0L) + deltaMobile

                      prefs.edit()
                          .putLong("wifi_bytes", totalWifi)
                          .putLong("mobile_bytes", totalMobile)
                          .putLong("current_speed", deltaTotal)
                          .apply()

                      updateNotification(deltaTotal, totalWifi, totalMobile)
                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  lastTotalBytes = TrafficStats.getTotalRxBytes() + TrafficStats.getTotalTxBytes()
                  lastMobileBytes = TrafficStats.getMobileRxBytes() + TrafficStats.getMobileTxBytes()

                  val initialNotification = buildNotification(0L, 0L, 0L)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(1, initialNotification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, initialNotification)
                  }
                  handler.postDelayed(runnable, 1000)
              }

              private fun updateNotification(speedBytes: Long, wifiBytes: Long, mobileBytes: Long) {
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.notify(1, buildNotification(speedBytes, wifiBytes, mobileBytes))
              }

              private fun buildNotification(speedBytes: Long, wifiBytes: Long, mobileBytes: Long): Notification {
                  val (speedVal, speedUnit) = getSpeedParts(speedBytes)
                  val wifiText = formatData(wifiBytes)
                  val mobileText = formatData(mobileBytes)

                  val openAppIntent = Intent(this, MainActivity::class.java)
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, openAppIntent, PendingIntent.FLAG_IMMUTABLE
                  )

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("السرعة: $speedVal $speedUnit")
                      .setContentText("واي فاي: $wifiText | بيانات: $mobileText")
                      .setSmallIcon(android.R.drawable.stat_sys_download_done)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setSilent(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()
              }

              private fun getSpeedParts(bytes: Long): Pair<String, String> {
                  val kb = bytes / 1024.0
                  val mb = kb / 1024.0
                  return if (mb >= 1.0) {
                      Pair(String.format("%.1f", mb), "MB/s")
                  } else {
                      Pair(String.format("%.0f", kb), "KB/s")
                  }
              }

              private fun formatData(bytes: Long): String {
                  val kb = bytes / 1024.0
                  val mb = kb / 1024.0
                  val gb = mb / 1024.0
                  return when {
                      gb >= 1.0 -> String.format("%.2f GB", gb)
                      mb >= 1.0 -> String.format("%.1f MB", mb)
                      else -> String.format("%.0f KB", kb)
                  }
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "NetSpeed Pro Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      channel.setShowBadge(false)
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacks(runnable)
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/netspeed/MainActivity.kt
          package com.example.netspeed

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.*
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var tvSpeed: TextView
              private lateinit var tvWifi: TextView
              private lateinit var tvMobile: TextView
              private val handler = Handler(Looper.getMainLooper())

              private val uiUpdater = object : Runnable {
                  override fun run() {
                      val prefs = getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                      val speed = prefs.getLong("current_speed", 0L)
                      val wifi = prefs.getLong("wifi_bytes", 0L)
                      val mobile = prefs.getLong("mobile_bytes", 0L)

                      tvSpeed.text = formatData(speed) + "/s"
                      tvWifi.text = formatData(wifi)
                      tvMobile.text = formatData(mobile)

                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvSpeed = findViewById(R.id.tvSpeed)
                  tvWifi = findViewById(R.id.tvWifi)
                  tvMobile = findViewById(R.id.tvMobile)

                  val btnStart: Button = findViewById(R.id.btnStart)
                  val btnStop: Button = findViewById(R.id.btnStop)
                  val btnReset: Button = findViewById(R.id.btnReset)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }

                  btnStart.setOnClickListener {
                      val serviceIntent = Intent(this, SpeedMeterService::class.java)
                      ContextCompat.startForegroundService(this, serviceIntent)
                  }

                  btnStop.setOnClickListener {
                      val serviceIntent = Intent(this, SpeedMeterService::class.java)
                      stopService(serviceIntent)
                      getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                          .edit().putLong("current_speed", 0L).apply()
                  }

                  btnReset.setOnClickListener {
                      getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                          .edit()
                          .putLong("wifi_bytes", 0L)
                          .putLong("mobile_bytes", 0L)
                          .apply()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  handler.post(uiUpdater)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(uiUpdater)
              }

              private fun formatData(bytes: Long): String {
                  val kb = bytes / 1024.0
                  val mb = kb / 1024.0
                  val gb = mb / 1024.0
                  return when {
                      gb >= 1.0 -> String.format("%.2f GB", gb)
                      mb >= 1.0 -> String.format("%.1f MB", mb)
                      else -> String.format("%.0f KB", kb)
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeedPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
