          cat << 'EOF' > app/src/main/java/com/netspeed/pro/meter/SpeedMeterService.kt
          package com.netspeed.pro.meter

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.net.TrafficStats
          import android.os.*
          import android.provider.Settings
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.style.RelativeSizeSpan
          import android.util.TypedValue
          import android.view.*
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import androidx.core.graphics.drawable.IconCompat
          import java.util.Locale

          class SpeedMeterService : Service() {

              private val handler = Handler(Looper.getMainLooper())
              private var lastTotalBytes: Long = 0
              private var lastMobileBytes: Long = 0
              private val CHANNEL_ID = "NetSpeedProLiveChannel"
              private var windowManager: WindowManager? = null
              private var floatingView: TextView? = null

              private val runnable = object : Runnable {
                  override fun run() {
                      val currentTotal = TrafficStats.getTotalRxBytes() + TrafficStats.getTotalTxBytes()
                      val currentMobile = TrafficStats.getMobileRxBytes() + TrafficStats.getMobileTxBytes()

                      val deltaTotal = (currentTotal - lastTotalBytes).coerceAtLeast(0L)
                      val deltaMobile = (currentMobile - lastMobileBytes).coerceAtLeast(0L)
                      val deltaWifi = (deltaTotal - deltaMobile).coerceAtLeast(0L)

                      lastTotalBytes = currentTotal
                      lastMobileBytes = currentMobile

                      val prefs = getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                      val totalWifi = prefs.getLong("wifi_bytes", 0L) + deltaWifi
                      val totalMobile = prefs.getLong("mobile_bytes", 0L) + deltaMobile

                      prefs.edit()
                          .putLong("wifi_bytes", totalWifi)
                          .putLong("mobile_bytes", totalMobile)
                          .putLong("current_speed", deltaTotal)
                          .putBoolean("is_running", true)
                          .apply()

                      updateNotification(deltaTotal, totalWifi, totalMobile)
                      updateFloatingOverlay(deltaTotal)
                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  lastTotalBytes = TrafficStats.getTotalRxBytes() + TrafficStats.getTotalTxBytes()
                  lastMobileBytes = TrafficStats.getMobileRxBytes() + TrafficStats.getMobileTxBytes()

                  getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                      .edit().putBoolean("is_running", true).apply()

                  val initialNotification = buildNotification(0L, 0L, 0L)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(1, initialNotification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, initialNotification)
                  }
                  handler.post(runnable)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  updateFloatingOverlay(0L)
                  return START_STICKY
              }

              private fun formatCompactOverlayText(speedVal: String, speedUnit: String): SpannableString {
                  val full = "$speedVal\n$speedUnit"
                  val span = SpannableString(full)
                  span.setSpan(
                      RelativeSizeSpan(0.78f),
                      speedVal.length + 1,
                      full.length,
                      Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  )
                  return span
              }

              private fun updateFloatingOverlay(speedBytes: Long) {
                  val prefs = getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                  val overlayEnabled = prefs.getBoolean("overlay_enabled", false)
                  val canDraw = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Settings.canDrawOverlays(this)
                  } else true

                  if (!overlayEnabled || !canDraw) {
                      removeFloatingOverlay()
                      return
                  }

                  val (speedVal, speedUnit) = getSpeedParts(speedBytes)
                  val styledText = formatCompactOverlayText(speedVal, speedUnit)

                  if (floatingView == null) {
                      windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      val metrics = resources.displayMetrics
                      val defaultX = (metrics.widthPixels * 0.56f).toInt()
                      val defaultY = (metrics.density * 6f).toInt()

                      val tv = TextView(this).apply {
                          setTextColor(Color.WHITE)
                          setShadowLayer(2.5f, 0f, 1f, Color.BLACK)
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 7.8f)
                          typeface = Typeface.create("sans-serif-condensed", Typeface.BOLD)
                          gravity = Gravity.CENTER
                          includeFontPadding = false
                          setLineSpacing(0f, 0.78f)
                          setPadding(6, 2, 6, 2)
                          text = styledText
                      }

                      val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      } else {
                          @Suppress("DEPRECATION")
                          WindowManager.LayoutParams.TYPE_PHONE
                      }

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.LEFT
                          x = prefs.getInt("overlay_x_v5", defaultX)
                          y = prefs.getInt("overlay_y_v5", defaultY)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              layoutInDisplayCutoutMode =
                                  WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                          }
                      }

                      tv.setOnTouchListener(object : View.OnTouchListener {
                          private var initialX = 0
                          private var initialY = 0
                          private var initialTouchX = 0f
                          private var initialTouchY = 0f

                          override fun onTouch(v: View, event: MotionEvent): Boolean {
                              when (event.action) {
                                  MotionEvent.ACTION_DOWN -> {
                                      initialX = params.x
                                      initialY = params.y
                                      initialTouchX = event.rawX
                                      initialTouchY = event.rawY
                                      return true
                                  }
                                  MotionEvent.ACTION_MOVE -> {
                                      params.x = initialX + (event.rawX - initialTouchX).toInt()
                                      params.y = (initialY + (event.rawY - initialTouchY).toInt()).coerceAtLeast(0)
                                      windowManager?.updateViewLayout(tv, params)
                                      return true
                                  }
                                  MotionEvent.ACTION_UP -> {
                                      prefs.edit()
                                          .putInt("overlay_x_v5", params.x)
                                          .putInt("overlay_y_v5", params.y)
                                          .apply()
                                      return true
                                  }
                              }
                              return false
                          }
                      })

                      try {
                          windowManager?.addView(tv, params)
                          floatingView = tv
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  } else {
                      floatingView?.text = styledText
                  }
              }

              private fun removeFloatingOverlay() {
                  floatingView?.let {
                      try {
                          windowManager?.removeView(it)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                      floatingView = null
                  }
              }

              private fun updateNotification(speedBytes: Long, wifiBytes: Long, mobileBytes: Long) {
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.notify(1, buildNotification(speedBytes, wifiBytes, mobileBytes))
              }

              private fun buildNotification(speedBytes: Long, wifiBytes: Long, mobileBytes: Long): Notification {
                  val (speedVal, speedUnit) = getSpeedParts(speedBytes)
                  val wifiText = formatData(wifiBytes)
                  val mobileText = formatData(mobileBytes)

                  val openAppIntent = Intent(this, MainActivity::class.java)
                  val pendingFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  } else {
                      PendingIntent.FLAG_UPDATE_CURRENT
                  }
                  val pendingIntent = PendingIntent.getActivity(this, 0, openAppIntent, pendingFlags)

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("السرعة الحالية: $speedVal $speedUnit")
                      .setContentText("واي فاي: $wifiText  |  بيانات: $mobileText")
                      .setSmallIcon(createSpeedIcon(speedVal, speedUnit))
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setSilent(true)
                      .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                      .build()
              }

              private fun createSpeedIcon(value: String, unit: String): IconCompat {
                  val bitmap = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bitmap)
                  val paint = Paint().apply {
                      color = Color.WHITE
                      isAntiAlias = true
                      textAlign = Paint.Align.CENTER
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  }

                  paint.textSize = if (value.length > 3) 38f else 46f
                  canvas.drawText(value, 48f, 45f, paint)

                  paint.textSize = 30f
                  canvas.drawText(unit, 48f, 86f, paint)

                  return IconCompat.createWithBitmap(bitmap)
              }

              private fun getSpeedParts(bytes: Long): Pair<String, String> {
                  val kb = bytes / 1024.0
                  val mb = kb / 1024.0
                  return when {
                      mb >= 10.0 -> Pair(String.format(Locale.US, "%.1f", mb), "MB/s")
                      mb >= 1.0 -> Pair(String.format(Locale.US, "%.2f", mb), "MB/s")
                      kb >= 100.0 -> Pair(String.format(Locale.US, "%.0f", kb), "KB/s")
                      kb >= 10.0 -> Pair(String.format(Locale.US, "%.1f", kb), "KB/s")
                      else -> Pair(String.format(Locale.US, "%.2f", kb), "KB/s")
                  }
              }

              private fun formatData(bytes: Long): String {
                  val kb = bytes / 1024.0
                  val mb = kb / 1024.0
                  val gb = mb / 1024.0
                  return when {
                      gb >= 1.0 -> String.format(Locale.US, "%.2f GB", gb)
                      mb >= 1.0 -> String.format(Locale.US, "%.1f MB", mb)
                      else -> String.format(Locale.US, "%.0f KB", kb)
                  }
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "مؤشر السرعة المباشر",
                          NotificationManager.IMPORTANCE_DEFAULT
                      ).apply {
                          setSound(null, null)
                          enableVibration(false)
                          setShowBadge(false)
                      }
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacks(runnable)
                  removeFloatingOverlay()
                  getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                      .edit()
                      .putBoolean("is_running", false)
                      .putLong("current_speed", 0L)
                      .apply()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/netspeed/pro/meter/MainActivity.kt
          package com.netspeed.pro.meter

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var tvSpeed: TextView
              private lateinit var tvWifi: TextView
              private lateinit var tvMobile: TextView
              private lateinit var tvStatusBadge: TextView
              private lateinit var btnStart: Button
              private lateinit var btnStop: Button
              private lateinit var btnOverlay: Button
              private lateinit var btnReset: Button
              private lateinit var footerDeveloper: LinearLayout
              private val handler = Handler(Looper.getMainLooper())

              private val uiUpdater = object : Runnable {
                  override fun run() {
                      val prefs = getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                      val speed = prefs.getLong("current_speed", 0L)
                      val wifi = prefs.getLong("wifi_bytes", 0L)
                      val mobile = prefs.getLong("mobile_bytes", 0L)
                      val isRunning = prefs.getBoolean("is_running", false)
                      val overlayEnabled = prefs.getBoolean("overlay_enabled", false)

                      tvSpeed.text = formatSpeed(speed)
                      tvWifi.text = formatData(wifi)
                      tvMobile.text = formatData(mobile)

                      updateRunningStateUI(isRunning, overlayEnabled)
                      handler.postDelayed(this, 500)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvSpeed = findViewById(R.id.tvSpeed)
                  tvWifi = findViewById(R.id.tvWifi)
                  tvMobile = findViewById(R.id.tvMobile)
                  tvStatusBadge = findViewById(R.id.tvStatusBadge)
                  btnStart = findViewById(R.id.btnStart)
                  btnStop = findViewById(R.id.btnStop)
                  btnOverlay = findViewById(R.id.btnOverlay)
                  btnReset = findViewById(R.id.btnReset)
                  footerDeveloper = findViewById(R.id.footerDeveloper)

                  applyHoverAndPressEffect(btnStart)
                  applyHoverAndPressEffect(btnStop)
                  applyHoverAndPressEffect(btnOverlay)
                  applyHoverAndPressEffect(btnReset)
                  applyHoverAndPressEffect(footerDeveloper)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }

                  btnStart.setOnClickListener {
                      val serviceIntent = Intent(this, SpeedMeterService::class.java)
                      ContextCompat.startForegroundService(this, serviceIntent)
                      Toast.makeText(this, "✅ تم تشغيل مؤشر السرعة في الأعلى", Toast.LENGTH_SHORT).show()
                  }

                  btnStop.setOnClickListener {
                      val serviceIntent = Intent(this, SpeedMeterService::class.java)
                      stopService(serviceIntent)
                      getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                          .edit()
                          .putBoolean("is_running", false)
                          .putLong("current_speed", 0L)
                          .apply()
                      Toast.makeText(this, "🛑 تم إيقاف مؤشر السرعة", Toast.LENGTH_SHORT).show()
                  }

                  btnOverlay.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "يرجى السماح بالظهور فوق التطبيقات لوضع العداد بجانب السيم", Toast.LENGTH_LONG).show()
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                          return@setOnClickListener
                      }

                      val prefs = getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                      val newState = !prefs.getBoolean("overlay_enabled", false)
                      prefs.edit().putBoolean("overlay_enabled", newState).apply()

                      val serviceIntent = Intent(this, SpeedMeterService::class.java)
                      ContextCompat.startForegroundService(this, serviceIntent)

                      if (newState) {
                          Toast.makeText(this, "📌 تم إظهار العداد! اسحبه بإصبعك بجانب إشارة السيم", Toast.LENGTH_LONG).show()
                      } else {
                          Toast.makeText(this, "تم إخفاء العداد العائم", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnReset.setOnClickListener {
                      getSharedPreferences("NetStats", Context.MODE_PRIVATE)
                          .edit()
                          .putLong("wifi_bytes", 0L)
                          .putLong("mobile_bytes", 0L)
                          .apply()
                      Toast.makeText(this, "🔄 تم تصفير عدادات الاستهلاك", Toast.LENGTH_SHORT).show()
                  }

                  footerDeveloper.setOnClickListener {
                      val message = "أحلى تحية لعمو نور الغالي❤️❤️❤️"
                      Toast.makeText(this, message, Toast.LENGTH_LONG).show()
                      AlertDialog.Builder(this)
                          .setMessage(message)
                          .setPositiveButton("حبيب القلب ❤️", null)
                          .show()
                  }
              }

              private fun updateRunningStateUI(isRunning: Boolean, overlayEnabled: Boolean) {
                  if (isRunning) {
                      tvStatusBadge.text = "● المؤشر شغّال الآن في أعلى الشاشة"
                      tvStatusBadge.setTextColor(Color.parseColor("#00E676"))
                      tvStatusBadge.setBackgroundResource(R.drawable.bg_status_on)

                      btnStart.text = "✅ المؤشر قيد التشغيل حالياً"
                      btnStart.alpha = 0.65f
                      btnStop.text = "⏹ إيقاف المؤشر الآن"
                      btnStop.alpha = 1.0f
                  } else {
                      tvStatusBadge.text = "● المؤشر متوقف حالياً"
                      tvStatusBadge.setTextColor(Color.parseColor("#FF5252"))
                      tvStatusBadge.setBackgroundResource(R.drawable.bg_status_off)

                      btnStart.text = "▶ تشغيل المؤشر في الشريط العلوي"
                      btnStart.alpha = 1.0f
                      btnStop.text = "⏹ المؤشر متوقف"
                      btnStop.alpha = 0.65f
                  }

                  if (overlayEnabled) {
                      btnOverlay.text = "📌 إخفاء العداد العائم بجانب السيم"
                  } else {
                      btnOverlay.text = "📌 إظهار العداد العائم بجانب إشارة السيم"
                  }
              }

              private fun applyHoverAndPressEffect(view: View) {
                  view.setOnTouchListener { v, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              v.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                              v.animate().scaleX(0.95f).scaleY(0.95f).setDuration(90).start()
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              v.animate().scaleX(1.0f).scaleY(1.0f).setDuration(90).start()
                          }
                      }
                      false
                  }
              }

              override fun onResume() {
                  super.onResume()
                  handler.post(uiUpdater)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(uiUpdater)
              }

              private fun formatSpeed(bytes: Long): String {
                  val kb = bytes / 1024.0
                  val mb = kb / 1024.0
                  return if (mb >= 1.0) {
                      String.format(Locale.US, "%.2f MB/s", mb)
                  } else {
                      String.format(Locale.US, "%.2f KB/s", kb)
                  }
              }

              private fun formatData(bytes: Long): String {
                  val kb = bytes / 1024.0
                  val mb = kb / 1024.0
                  val gb = mb / 1024.0
                  return when {
                      gb >= 1.0 -> String.format(Locale.US, "%.2f GB", gb)
                      mb >= 1.0 -> String.format(Locale.US, "%.1f MB", mb)
                      else -> String.format(Locale.US, "%.0f KB", kb)
                  }
              }
          }
